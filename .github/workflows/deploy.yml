name: Tixora CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Test (CI)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify code formatting & vet
        run: |
          go fmt ./...
          go vet ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Build Go server binary
        run: go build -v -o bin/server ./cmd/main.go

  # -------------------------------------------------------------
  # Job 2: Deploy to Vercel (CD)
  # -------------------------------------------------------------
  deploy-to-vercel:
    name: Deploy to Vercel
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ ERROR: VERCEL_TOKEN secret is missing in GitHub Repository Secrets!"
            echo "Go to: Repo Settings -> Secrets and variables -> Actions -> Add secret 'VERCEL_TOKEN'"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "❌ ERROR: VERCEL_ORG_ID secret is missing in GitHub Repository Secrets!"
            echo "Go to: Repo Settings -> Secrets and variables -> Actions -> Add secret 'VERCEL_ORG_ID'"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "❌ ERROR: VERCEL_PROJECT_ID secret is missing in GitHub Repository Secrets!"
            echo "Go to: Repo Settings -> Secrets and variables -> Actions -> Add secret 'VERCEL_PROJECT_ID'"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Project Artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Project Artifacts to Vercel Production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
